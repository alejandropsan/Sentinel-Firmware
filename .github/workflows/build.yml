name: Build Sentinel Firmware

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

env:
  FIRMWARE_NAME: Sentinel

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Sentinel Firmware
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Cache FBT toolchain
      uses: actions/cache@v4
      with:
        path: |
          ~/.fbt_cache
          toolchain
        key: ${{ runner.os }}-fbt-${{ hashFiles('scripts/toolchain/**') }}
        restore-keys: |
          ${{ runner.os }}-fbt-
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget libusb-1.0-0-dev
    
    - name: Build firmware
      run: |
        ./fbt updater_package
        
    - name: Build info
      run: |
        ./fbt version_get
        ls -lh dist/
    
    - name: Upload artifacts - Full Package
      uses: actions/upload-artifact@v4
      with:
        name: sentinel-firmware-full-${{ github.sha }}
        path: dist/f7-C/*.tgz
        retention-days: 30
    
    - name: Upload artifacts - Update Package
      uses: actions/upload-artifact@v4
      with:
        name: sentinel-firmware-update-${{ github.sha }}
        path: dist/f7-C/*.zip
        retention-days: 30
    
    - name: Check firmware size
      run: |
        echo "### Firmware Size Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        ./fbt firmware_size || true
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: sentinel-firmware-*
        path: release-files
    
    - name: Generate changelog
      id: changelog
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        
        if grep -q "## \[$VERSION\]" CHANGELOG.md; then
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' > release-notes.md
        else
          echo "No changelog found for $VERSION" > release-notes.md
        fi
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: Sentinel Firmware ${{ steps.changelog.outputs.VERSION }}
        body_path: release-notes.md
        files: |
          release-files/**/*.tgz
          release-files/**/*.zip
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Run linter
      run: |
        ./fbt lint || true
    
    - name: Code formatting check
      run: |
        ./fbt format_check || true
